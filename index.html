<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>

    <style>
        body {
            font-family: "Times New Roman";
            text-align: center;
            background-color: #f2f2f2;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border: 2px solid black;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TechFest 2026</h1>

    <p>
        A technical event for students to showcase their
        knowledge, creativity and technical skills.
    </p>

    <h2>Student Registration</h2>

    <form>

        <input type="text"
               placeholder="Student Name"
               required>

        <input type="text"
               placeholder="Register Number"
               required>

        <input type="text"
               placeholder="Department"
               required>

        <input type="email"
               placeholder="Email"
               required>

        <p>
            <strong>Event Date:</strong>
            20 October 2026
        </p>

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>
</html>
